<!DOCTYPE html>
<html>
<head>
    <title>Kahoot Host</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='host.css') }}">
</head>
<body>
    <div class="card">
        <h1>Host Dashboard</h1>
        <div id="status">Waiting for players to join...</div>
        <br>
        <button id="startBtn" onclick="startGame()">Start Game</button>
        <button id="nextBtn" onclick="nextQuestion()" style="display:none;">Next Question</button>
        
        <h2 id="leaderboardTitle" style="display:none;">Standings:</h2>
        <ul id="playerList"></ul>
    </div>

    <script>
        // Track the exact strings internally so we don't rely on the browser's HTML parser
        let lastPlayerHTML = "";
        let lastStatusHTML = "";

        function startGame() {
            fetch('/start', {method: 'POST'});
            document.getElementById("startBtn").style.display = "none";
        }

        function nextQuestion() {
            fetch('/next', {method: 'POST'});
        }

        setInterval(async () => {
            // cache: "no-store" forces the browser to pull live data every single time
            let res = await fetch('/state', { cache: 'no-store' });
            let data = await res.json();
            
            let list = document.getElementById("playerList");
            let statusDiv = document.getElementById("status");
            
            let newPlayerHTML = ""; 
            let newStatusHTML = statusDiv.innerHTML;

            if (data.status === "waiting") {
                data.players.forEach(p => newPlayerHTML += `<li>${p} joined!</li>`);
            
            } else if (data.status === "playing") {
                newStatusHTML = `<h2>Question ${data.question_number}</h2><p style="font-size:30px">⏳ ${data.time_left}s</p><p>📩 Answers in: ${data.answers_count}</p>`;
                document.getElementById("nextBtn").style.display = "none";
                document.getElementById("leaderboardTitle").style.display = "none";
            
            } else if (data.status === "revealed") {
                newStatusHTML = `<h2 style="color:red">Time's Up!</h2><p>The correct answer was: <b>${data.correct_answer}</b></p>`;
                
                let nextBtn = document.getElementById("nextBtn");
                nextBtn.style.display = "inline-block";
                nextBtn.innerText = data.is_last_question ? "End Game" : "Next Question";
                
                document.getElementById("leaderboardTitle").style.display = "block";
                
                let sortedScores = Object.entries(data.scores).sort((a, b) => b[1] - a[1]);
                sortedScores.forEach(([user, score]) => {
                    newPlayerHTML += `<li><b>${user}</b>: ${score} pts</li>`;
                });

            } else if (data.status === "gameover") {
                newStatusHTML = "<h2>Game Over! Final Podium:</h2>";
                document.getElementById("nextBtn").style.display = "none";
                document.getElementById("leaderboardTitle").style.display = "none";
                
                let sortedScores = Object.entries(data.scores).sort((a, b) => b[1] - a[1]);
                sortedScores.forEach(([user, score], index) => {
                    let medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : "🏅";
                    newPlayerHTML += `<li>${medal} <b>${user}</b>: ${score} pts</li>`;
                });
            }

            // ONLY update the live screen if our internal tracker sees a difference
            if (lastPlayerHTML !== newPlayerHTML) {
                list.innerHTML = newPlayerHTML;
                lastPlayerHTML = newPlayerHTML; // Update our tracker
            }

            if (lastStatusHTML !== newStatusHTML) {
                statusDiv.innerHTML = newStatusHTML;
                lastStatusHTML = newStatusHTML; // Update our tracker
            }
            
        }, 1000);
    </script>
</body>
</html>
